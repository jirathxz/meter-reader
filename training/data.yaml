# Dataset config for YOLO26 fine-tuning.
# YOLO ทำหน้าที่อ่านตัวเลขในตัวเดียว: class = ค่าของตัวเลขแต่ละหลัก (0-9)
# Layout: training/dataset/images/{train,val}/  training/dataset/labels/{train,val}/

path: dataset
